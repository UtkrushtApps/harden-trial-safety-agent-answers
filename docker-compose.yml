services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sitepilot
      POSTGRES_PASSWORD: sitepilot_dev
      POSTGRES_DB: clinical_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clinical_agent_pgdata:/var/lib/postgresql/data
      - ./init_database.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitepilot -d clinical_agent"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  clinical_agent_pgdata:
